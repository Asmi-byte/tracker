<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Calories + Protein Tracker</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--line:#e3e1dc;--accent:#2f6f4f;--on-accent:#fff;--bar:#e6e4df;--warn:#b4472f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--text:#efede8;--muted:#9a9890;--line:#33322f;--accent:#5fb48a;--on-accent:#0e1f16;--bar:#33322f;--warn:#e0805f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--text:#efede8;--muted:#9a9890;--line:#33322f;--accent:#5fb48a;--on-accent:#0e1f16;--bar:#33322f;--warn:#e0805f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.status{color:var(--muted);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.row .over{color:var(--warn)}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar:last-child{margin-bottom:0}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.fill.over{background:var(--warn)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li small{display:block;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:13px;background:var(--accent);color:var(--on-accent);font-weight:600;width:100%}
button.secondary{background:var(--bar);color:var(--text)}
button.small{width:auto;padding:6px 10px;font-size:13px;background:var(--bar);color:var(--text)}
button:disabled,input:disabled{opacity:.4}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px;z-index:5}
.panel.show{display:flex}
.panel .box{background:var(--card);border-radius:14px;padding:18px;max-width:400px;width:100%;max-height:80vh;overflow:auto}
.panel h3{margin:0 0 10px}
.panel p{margin:4px 0}
</style>
</head>
<body>
<main>
  <h1>Calories + Protein</h1>
  <p class="status" id="status"></p>

  <div class="card">
    <h2>Today</h2>
    <div class="row"><span>Calories</span><span id="calText"></span></div>
    <div class="bar"><div class="fill" id="calBar"></div></div>
    <div class="row"><span>Protein</span><span id="proText"></span></div>
    <div class="bar"><div class="fill" id="proBar"></div></div>
  </div>

  <div class="card">
    <h2>Meals</h2>
    <ul id="meals"></ul>
  </div>

  <div class="card">
    <h2>Add meal</h2>
    <input id="name" placeholder="Meal name" autocomplete="off">
    <div class="two">
      <input id="cal" placeholder="Calories" inputmode="decimal">
      <input id="pro" placeholder="Protein (g)" inputmode="decimal">
    </div>
    <button id="add">Add meal</button>
  </div>

  <div class="btns">
    <button id="start">Start day</button>
    <button id="end" class="secondary">End day</button>
    <button id="avg" class="secondary">Past average</button>
  </div>
</main>

<div class="panel" id="panel"><div class="box">
  <h3 id="pTitle"></h3><div id="pBody"></div>
  <button id="pClose" style="margin-top:14px">Close</button>
</div></div>

<script>
const TARGET_CAL = 1600, TARGET_PRO = 100, AVG_DAYS = 5, KEY = "calorie-tracker-v1";
let state = { history: [], meals: [], active: false };
const $ = id => document.getElementById(id);

function load() {
  try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
const sum = (arr, k) => arr.reduce((t, x) => t + x[k], 0);
const fmt = n => Math.round(n * 10) / 10;

function line(label, total, target, unit) {
  const left = target - total;
  return left >= 0 ? fmt(total) + " / " + target + unit + " (" + fmt(left) + unit + " left)"
                   : fmt(total) + " / " + target + unit + " (over by " + fmt(-left) + unit + ")";
}

function render() {
  const cal = sum(state.meals, "calories"), pro = sum(state.meals, "protein");
  $("calText").textContent = line("Calories", cal, TARGET_CAL, "");
  $("proText").textContent = line("Protein", pro, TARGET_PRO, " g");
  $("calText").className = cal > TARGET_CAL ? "over" : "";
  $("proText").className = pro > TARGET_PRO ? "over" : "";
  $("calBar").style.width = Math.min(cal / TARGET_CAL * 100, 100) + "%";
  $("proBar").style.width = Math.min(pro / TARGET_PRO * 100, 100) + "%";
  $("calBar").classList.toggle("over", cal > TARGET_CAL);
  $("proBar").classList.toggle("over", pro > TARGET_PRO);

  const ul = $("meals");
  ul.innerHTML = "";
  if (!state.meals.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = state.active ? "No meals yet." : "Start a day to log meals.";
    ul.appendChild(li);
  }
  state.meals.forEach((m, i) => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.textContent = m.meal_name;
    const sub = document.createElement("small");
    sub.textContent = fmt(m.calories) + " cal, " + fmt(m.protein) + " g protein";
    info.appendChild(sub);
    const del = document.createElement("button");
    del.className = "small";
    del.textContent = "Delete";
    del.onclick = () => { state.meals.splice(i, 1); save(); render(); };
    li.append(info, del);
    ul.appendChild(li);
  });

  $("status").textContent = state.active ? "Day in progress" : "No active day. Tap Start day.";
  ["name", "cal", "pro", "add", "end"].forEach(id => $(id).disabled = !state.active);
  $("start").disabled = state.active;
  document.querySelectorAll("li .small").forEach(b => b.disabled = !state.active);
}

function showPanel(title, lines) {
  $("pTitle").textContent = title;
  $("pBody").innerHTML = "";
  lines.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("pBody").appendChild(p); });
  $("panel").classList.add("show");
}

$("pClose").onclick = () => $("panel").classList.remove("show");

$("start").onclick = () => { state.meals = []; state.active = true; save(); render(); $("name").focus(); };

$("add").onclick = () => {
  if (!state.active) return;
  const calories = parseFloat($("cal").value);
  const protein = $("pro").value.trim() === "" ? 0 : parseFloat($("pro").value);
  if (isNaN(calories) || isNaN(protein) || calories < 0 || protein < 0) {
    showPanel("Check your numbers", ["Calories and protein need to be positive numbers."]);
    return;
  }
  state.meals.push({ meal_name: $("name").value.trim() || "Meal", calories, protein });
  $("name").value = $("cal").value = $("pro").value = "";
  save(); render();
};

$("end").onclick = () => {
  if (!state.active) return;
  const cal = sum(state.meals, "calories"), pro = sum(state.meals, "protein");
  const lines = [
    "Total calories: " + fmt(cal) + " / " + TARGET_CAL,
    "Total protein: " + fmt(pro) + " g / " + TARGET_PRO + " g",
    "Meals:"
  ];
  if (!state.meals.length) lines.push("(none logged)");
  state.meals.forEach(m => lines.push("• " + m.meal_name + ": " + fmt(m.calories) + " cal, " + fmt(m.protein) + " g protein"));
  state.history.push({ date: new Date().toISOString().slice(0, 10), calories: cal, protein: pro });
  state.active = false; state.meals = [];
  save(); render();
  showPanel("Day summary", lines);
};

$("avg").onclick = () => {
  const recent = state.history.slice(-AVG_DAYS);
  if (!recent.length) { showPanel("Past average", ["No finished days yet."]); return; }
  showPanel("Past average", [
    "Over your last " + recent.length + " day(s):",
    "Calories: " + Math.round(sum(recent, "calories") / recent.length),
    "Protein: " + Math.round(sum(recent, "protein") / recent.length) + " g"
  ]);
};

load();
render();
</script>
</body>
</html>
